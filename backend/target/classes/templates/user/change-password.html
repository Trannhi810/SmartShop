<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Đổi mật khẩu, tăng cường bảo mật cho tài khoản SmartShop của bạn">
    <meta name="keywords" content="đổi mật khẩu, bảo mật tài khoản, SmartShop">
    <meta name="author" content="SmartShop">
    <title>Đổi mật khẩu - SmartShop</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="/css/home.css">
    <link rel="stylesheet" href="/css/change-password.css">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main>
    <div class="change-password-container">
        <a href="/user/profile.html" class="back-link">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            Quay lại hồ sơ
        </a>
        
        <div class="change-password-header">
            <h1>Đổi mật khẩu</h1>
            <p>Thay đổi mật khẩu để bảo vệ tài khoản của bạn</p>
        </div>
        
        <div id="alertContainer"></div>
        
        <div class="change-password-form">
            <h3>Thông tin mật khẩu</h3>
            <form id="changePasswordForm">
                <div class="form-group">
                    <label class="form-label" for="currentPassword">Mật khẩu hiện tại</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="currentPassword" name="currentPassword" class="form-input" placeholder="Nhập mật khẩu hiện tại" required>
                        <button type="button" class="password-toggle" data-target="currentPassword" aria-label="Hiển thị mật khẩu">
                            <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg class="eye-off-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="newPassword">Mật khẩu mới</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="newPassword" name="newPassword" class="form-input" placeholder="Nhập mật khẩu mới (tối thiểu 6 ký tự)" required minlength="6">
                        <button type="button" class="password-toggle" data-target="newPassword" aria-label="Hiển thị mật khẩu">
                            <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg class="eye-off-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="confirmPassword">Xác nhận mật khẩu mới</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="confirmPassword" name="confirmPassword" class="form-input" placeholder="Nhập lại mật khẩu mới" required minlength="6">
                        <button type="button" class="password-toggle" data-target="confirmPassword" aria-label="Hiển thị mật khẩu">
                            <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg class="eye-off-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                </div>
                
                <div class="form-actions">
                    <a href="/user/profile.html" class="btn-cancel">Hủy</a>
                    <button type="submit" class="button">Đổi mật khẩu</button>
                </div>
            </form>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<div class="loading-overlay" id="loadingOverlay">
    <div class="spinner-border" role="status" style="width: 3rem; height: 3rem; color: var(--color-primary);">
        <span class="visually-hidden">Loading...</span>
    </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/notifications.js" defer></script>
<script>
    // Load user data to check authentication
    document.addEventListener('DOMContentLoaded', async () => {
        try {
            const currentUser = await api.getCurrentUser();
            if (!currentUser) {
                window.location.href = '/auth/login.html?redirect=' + encodeURIComponent(window.location.pathname);
                return;
            }
        } catch (error) {
            console.error('Error loading user:', error);
            showAlert('Không thể tải thông tin người dùng. Vui lòng đăng nhập lại.', 'error');
            setTimeout(() => {
                window.location.href = '/auth/login.html?redirect=' + encodeURIComponent(window.location.pathname);
            }, 2000);
            return;
        }
        
        // Setup password toggle buttons
        setupPasswordToggles();
        
        // Setup form submit
        setupChangePasswordForm();
    });
    
    function setupPasswordToggles() {
        document.querySelectorAll('.password-toggle').forEach(toggle => {
            toggle.addEventListener('click', function() {
                const targetId = this.getAttribute('data-target');
                const input = document.getElementById(targetId);
                const eyeIcon = this.querySelector('.eye-icon');
                const eyeOffIcon = this.querySelector('.eye-off-icon');
                
                if (input.type === 'password') {
                    input.type = 'text';
                    eyeIcon.style.display = 'none';
                    eyeOffIcon.style.display = 'block';
                    this.setAttribute('aria-label', 'Ẩn mật khẩu');
                } else {
                    input.type = 'password';
                    eyeIcon.style.display = 'block';
                    eyeOffIcon.style.display = 'none';
                    this.setAttribute('aria-label', 'Hiển thị mật khẩu');
                }
            });
        });
    }
    
    function setupChangePasswordForm() {
        const form = document.getElementById('changePasswordForm');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            // Validate
            if (!currentPassword) {
                showAlert('❌ Vui lòng nhập mật khẩu hiện tại.', 'error');
                document.getElementById('currentPassword').focus();
                return;
            }
            
            if (!newPassword || newPassword.length < 6) {
                showAlert('❌ Mật khẩu mới phải có ít nhất 6 ký tự.', 'error');
                document.getElementById('newPassword').focus();
                return;
            }
            
            if (newPassword !== confirmPassword) {
                showAlert('❌ Mật khẩu mới và xác nhận mật khẩu không khớp. Vui lòng kiểm tra lại.', 'error');
                document.getElementById('confirmPassword').focus();
                return;
            }
            
            // Check if new password is same as current password
            if (currentPassword === newPassword) {
                showAlert('⚠️ Mật khẩu mới phải khác mật khẩu hiện tại.', 'error');
                document.getElementById('newPassword').focus();
                return;
            }
            
            // Confirm before changing password
            const confirmed = confirm(
                '🔒 Xác nhận đổi mật khẩu\n\n' +
                'Bạn có chắc chắn muốn đổi mật khẩu?\n\n' +
                'Sau khi đổi mật khẩu, bạn sẽ cần đăng nhập lại với mật khẩu mới.'
            );
            
            if (!confirmed) {
                return;
            }
            
            try {
                showLoading(true);
                const result = await api.changePassword(currentPassword, newPassword, confirmPassword);
                
                // Show success message with more details
                showAlert(
                    '✅ Đổi mật khẩu thành công!\n\n' +
                    'Mật khẩu của bạn đã được thay đổi. Vui lòng sử dụng mật khẩu mới cho lần đăng nhập tiếp theo.',
                    'success'
                );
                
                // Reset form after a short delay
                setTimeout(() => {
                    resetPasswordForm();
                    // Optionally redirect to profile page
                    setTimeout(() => {
                        window.location.href = '/user/profile.html';
                    }, 2000);
                }, 1000);
                
            } catch (error) {
                console.error('Error changing password:', error);
                let errorMessage = 'Không thể đổi mật khẩu. Vui lòng thử lại sau.';
                
                // Parse error message from response
                if (error.message) {
                    errorMessage = error.message;
                } else if (error.response) {
                    try {
                        const errorData = await error.response.json();
                        errorMessage = errorData.message || errorMessage;
                    } catch (e) {
                        // If can't parse JSON, use default message
                    }
                }
                
                showAlert('❌ ' + errorMessage, 'error');
            } finally {
                showLoading(false);
            }
        });
    }
    
    function resetPasswordForm() {
        document.getElementById('currentPassword').value = '';
        document.getElementById('newPassword').value = '';
        document.getElementById('confirmPassword').value = '';
    }
    
    function showAlert(message, type = 'info') {
        const container = document.getElementById('alertContainer');
        const alert = document.createElement('div');
        alert.className = `alert alert-${type === 'error' ? 'error' : 'success'}`;
        
        // Support multi-line messages
        if (message.includes('\n')) {
            const lines = message.split('\n');
            lines.forEach((line, index) => {
                if (line.trim()) {
                    const lineElement = document.createElement('div');
                    lineElement.textContent = line;
                    if (index > 0) {
                        lineElement.style.marginTop = '4px';
                    }
                    alert.appendChild(lineElement);
                }
            });
        } else {
            alert.textContent = message;
        }
        
        // Add close button
        const closeBtn = document.createElement('button');
        closeBtn.innerHTML = '&times;';
        closeBtn.style.cssText = 'float: right; background: none; border: none; font-size: 1.5rem; cursor: pointer; opacity: 0.7; line-height: 1; padding: 0; margin-left: 12px;';
        closeBtn.onclick = () => alert.remove();
        closeBtn.onmouseover = () => closeBtn.style.opacity = '1';
        closeBtn.onmouseout = () => closeBtn.style.opacity = '0.7';
        alert.appendChild(closeBtn);
        
        container.innerHTML = '';
        container.appendChild(alert);
        
        // Auto remove after 7 seconds for success, 10 seconds for error
        const timeout = type === 'error' ? 10000 : 7000;
        setTimeout(() => {
            if (alert.parentNode) {
                alert.remove();
            }
        }, timeout);
    }
    
    function showLoading(show) {
        const overlay = document.getElementById('loadingOverlay');
        if (show) {
            overlay.classList.add('active');
        } else {
            overlay.classList.remove('active');
        }
    }
</script>
</body>
</html>
