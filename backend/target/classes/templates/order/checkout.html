<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Hoàn tất thanh toán đơn hàng của bạn trên SmartShop một cách an toàn">
    <meta name="keywords" content="thanh toán, checkout, đơn hàng, SmartShop">
    <meta name="author" content="SmartShop">
    <title>Thanh toán - SmartShop</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="/css/home.css">
    <link rel="stylesheet" href="/css/checkout.css">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main>
    <section class="section">
        <div class="container checkout-container">
            <div class="checkout-header">
                <h1>Thanh toán</h1>
                <p style="color: var(--color-muted);">Hoàn tất thông tin để đặt hàng</p>
            </div>
            
            <div id="alertContainer"></div>
            
            <form id="checkoutForm" class="checkout-form">
                <div>
                    <div class="form-section">
                        <h3 class="form-section-title">Thông tin giao hàng</h3>
                        <div class="form-group">
                            <label class="form-label" for="customerName">Họ và tên *</label>
                            <input type="text" class="form-input" id="customerName" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="customerPhone">Số điện thoại *</label>
                            <input type="tel" class="form-input" id="customerPhone" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="shippingAddress">Địa chỉ giao hàng *</label>
                            <textarea class="form-textarea" id="shippingAddress" required></textarea>
                        </div>
                    </div>
                    
                    <div class="form-section">
                        <h3 class="form-section-title">Phương thức giao hàng</h3>
                        <div class="radio-group">
                            <div class="radio-item">
                                <input type="radio" name="shippingMethod" id="shippingStandard" value="STANDARD" checked>
                                <label for="shippingStandard">Giao hàng tiêu chuẩn - 30,000 đ</label>
                            </div>
                            <div class="radio-item">
                                <input type="radio" name="shippingMethod" id="shippingExpress" value="EXPRESS">
                                <label for="shippingExpress">Giao hàng nhanh - 50,000 đ</label>
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-section">
                        <h3 class="form-section-title">Phương thức thanh toán</h3>
                        <div class="radio-group">
                            <div class="radio-item">
                                <input type="radio" name="paymentMethod" id="paymentCOD" value="COD" checked>
                                <label for="paymentCOD">Thanh toán khi nhận hàng (COD)</label>
                            </div>
                            <div class="radio-item">
                                <input type="radio" name="paymentMethod" id="paymentVNPay" value="VNPAY">
                                <label for="paymentVNPay">VNPay</label>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div>
                    <div class="summary-card">
                        <h3 class="summary-title">Tóm tắt đơn hàng</h3>
                        <div id="orderSummary">
                            <div class="text-center">
                                <div class="spinner-border" role="status" style="width: 3rem; height: 3rem; color: var(--color-primary);">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                            </div>
                        </div>
                        
                        <div class="voucher-section">
                            <h4 style="font-size: 1rem; margin: 0 0 12px; font-weight: 600;">Mã giảm giá</h4>
                            <div class="voucher-input-group">
                                <input type="text" 
                                       class="voucher-input" 
                                       id="checkoutVoucherCode" 
                                       placeholder="Nhập mã giảm giá">
                                <button type="button" class="voucher-button" onclick="applyVoucherCheckout()">Áp dụng</button>
                            </div>
                            <div id="checkoutVoucherMessage" class="voucher-message"></div>
                            <div id="checkoutVoucherDiscount" style="display: none;">
                                <div class="voucher-applied">
                                    <span class="voucher-code" id="checkoutAppliedVoucherCode"></span>
                                    <button type="button" class="voucher-remove" onclick="removeVoucherCheckout()">Xóa</button>
                                </div>
                            </div>
                        </div>
                        
                        <button type="submit" class="checkout-button">Đặt hàng</button>
                    </div>
                </div>
            </form>
        </div>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="/js/api.js"></script>
<script src="/js/notifications.js" defer></script>
<script src="/js/home.js" defer></script>
<script src="/js/checkout.js"></script>
<script>
    function handleSearch(event) {
        event.preventDefault();
        const searchInput = document.getElementById('searchInput');
        const keyword = searchInput ? searchInput.value.trim() : '';
        
        if (keyword) {
            window.location.href = `/product.html?q=${encodeURIComponent(keyword)}`;
        } else {
            window.location.href = '/product.html';
        }
    }
    
</script>
</body>
</html>
