<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Quản lý thông tin tài khoản, cập nhật hồ sơ cá nhân và đổi mật khẩu trên SmartShop">
    <meta name="keywords" content="hồ sơ, tài khoản, thông tin cá nhân, SmartShop">
    <meta name="author" content="SmartShop">
    <title>Hồ sơ của tôi - SmartShop</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="/css/home.css">
    <link rel="stylesheet" href="/css/profile.css">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main>
    <div class="profile-container">
        <div class="profile-header">
            <h1>Hồ sơ của tôi</h1>
            <p style="color: var(--color-muted);">Quản lý thông tin tài khoản và cài đặt cá nhân</p>
        </div>
        
        <div id="alertContainer"></div>
        
        <div class="avatar-section">
            <div class="avatar-wrapper">
                <div class="avatar-preview" id="avatarPreview">
                    <svg viewBox="0 0 24 24" width="60" height="60" fill="currentColor">
                        <path d="M12 12a4.5 4.5 0 1 0-4.5-4.5A4.5 4.5 0 0 0 12 12Zm0 2.25c-3.03 0-9 1.52-9 4.5v.75A1.5 1.5 0 0 0 4.5 21h15a1.5 1.5 0 0 0 1.5-1.5v-.75c0-2.98-5.97-4.5-9-4.5Z"/>
                    </svg>
                </div>
                <label for="avatarInput" class="avatar-upload-btn" title="Thay đổi ảnh đại diện">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="17 8 12 3 7 8"/>
                        <line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                </label>
                <input type="file" id="avatarInput" class="avatar-input" accept="image/*">
            </div>
        </div>
        
        <div class="profile-form">
            <form id="profileForm">
                <div class="form-group">
                    <label class="form-label" for="fullName">Họ và tên</label>
                    <input type="text" id="fullName" name="fullName" class="form-input" placeholder="Nhập họ và tên">
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" id="email" name="email" class="form-input" placeholder="Nhập email" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="phone">Số điện thoại</label>
                    <input type="tel" id="phone" name="phone" class="form-input" placeholder="Nhập số điện thoại">
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="username">Tên đăng nhập</label>
                    <input type="text" id="username" name="username" class="form-input" placeholder="Tên đăng nhập" disabled style="background: rgba(15, 23, 42, 0.05); cursor: not-allowed;">
                    <small style="color: var(--color-muted); font-size: 0.85rem;">Tên đăng nhập không thể thay đổi</small>
                </div>
                
                <div class="form-actions">
                    <button type="button" class="btn-cancel" onclick="resetForm()">Hủy</button>
                    <button type="submit" class="button">Lưu thay đổi</button>
                </div>
            </form>
        </div>
        
        <!-- Change Password Link -->
        <div class="profile-form" style="margin-top: 2.5rem; text-align: center;">
            <h3>Bảo mật tài khoản</h3>
            <p style="color: var(--color-muted); margin-bottom: 1.5rem;">
                Để bảo vệ tài khoản của bạn, hãy thường xuyên thay đổi mật khẩu
            </p>
            <a href="/user/change-password.html" class="button" style="text-decoration: none; display: inline-block;">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: middle; margin-right: 8px;">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                Đổi mật khẩu
            </a>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<div class="loading-overlay" id="loadingOverlay">
    <div class="spinner-border" role="status" style="width: 3rem; height: 3rem; color: var(--color-primary);">
        <span class="visually-hidden">Loading...</span>
    </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/notifications.js" defer></script>
<script src="/js/home.js" defer></script>
<script>
    let currentUser = null;
    let originalData = {};
    
    // Load user data
    document.addEventListener('DOMContentLoaded', async () => {
        try {
            currentUser = await api.getCurrentUser();
            if (!currentUser) {
                window.location.href = '/auth/login.html';
                return;
            }
            
            loadUserData(currentUser);
        } catch (error) {
            console.error('Error loading user:', error);
            showAlert('Không thể tải thông tin người dùng. Vui lòng đăng nhập lại.', 'error');
            setTimeout(() => {
                window.location.href = '/auth/login.html';
            }, 2000);
        }
        
        // Setup avatar upload
        setupAvatarUpload();
        
        // Setup form submit
        setupFormSubmit();
    });
    
    function loadUserData(user) {
        document.getElementById('fullName').value = user.fullName || '';
        document.getElementById('email').value = user.email || '';
        document.getElementById('phone').value = user.phone || '';
        document.getElementById('username').value = user.username || '';
        
        // Store original data
        originalData = {
            fullName: user.fullName || '',
            email: user.email || '',
            phone: user.phone || '',
            avatar: user.avatar || ''
        };
        
        // Load avatar
        if (user.avatar) {
            const avatarPreview = document.getElementById('avatarPreview');
            avatarPreview.innerHTML = `<img src="${user.avatar}" alt="Avatar">`;
        }
    }
    
    function setupAvatarUpload() {
        const avatarInput = document.getElementById('avatarInput');
        const avatarPreview = document.getElementById('avatarPreview');
        
        avatarInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            // Validate file type
            if (!file.type.startsWith('image/')) {
                showAlert('Vui lòng chọn file ảnh hợp lệ.', 'error');
                return;
            }
            
            // Validate file size (max 5MB)
            if (file.size > 5 * 1024 * 1024) {
                showAlert('Kích thước ảnh không được vượt quá 5MB.', 'error');
                return;
            }
            
            // Show preview
            const reader = new FileReader();
            reader.onload = (e) => {
                avatarPreview.innerHTML = `<img src="${e.target.result}" alt="Avatar preview">`;
            };
            reader.readAsDataURL(file);
            
            // Upload avatar
            try {
                showLoading(true);
                const formData = new FormData();
                formData.append('file', file);
                
                const result = await api.uploadAvatar(formData);
                if (result && result.avatar) {
                    showAlert('Cập nhật ảnh đại diện thành công!', 'success');
                    originalData.avatar = result.avatar;
                }
            } catch (error) {
                console.error('Error uploading avatar:', error);
                showAlert('Không thể tải ảnh lên. Vui lòng thử lại sau.', 'error');
                // Revert preview
                if (originalData.avatar) {
                    avatarPreview.innerHTML = `<img src="${originalData.avatar}" alt="Avatar">`;
                } else {
                    avatarPreview.innerHTML = `
                        <svg viewBox="0 0 24 24" width="60" height="60" fill="currentColor">
                            <path d="M12 12a4.5 4.5 0 1 0-4.5-4.5A4.5 4.5 0 0 0 12 12Zm0 2.25c-3.03 0-9 1.52-9 4.5v.75A1.5 1.5 0 0 0 4.5 21h15a1.5 1.5 0 0 0 1.5-1.5v-.75c0-2.98-5.97-4.5-9-4.5Z"/>
                        </svg>
                    `;
                }
            } finally {
                showLoading(false);
                avatarInput.value = '';
            }
        });
    }
    
    function setupFormSubmit() {
        const form = document.getElementById('profileForm');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                fullName: document.getElementById('fullName').value.trim(),
                email: document.getElementById('email').value.trim(),
                phone: document.getElementById('phone').value.trim()
            };
            
            // Validate
            if (!formData.email) {
                showAlert('Email là bắt buộc.', 'error');
                return;
            }
            
            try {
                showLoading(true);
                const result = await api.updateProfile(formData);
                
                if (result) {
                    showAlert('Cập nhật thông tin thành công!', 'success');
                    originalData = { ...originalData, ...formData };
                    
                    // Reload user data
                    currentUser = await api.getCurrentUser();
                    if (currentUser) {
                        loadUserData(currentUser);
                        // Sync header UI if updateAuthUI is available
                        if (typeof window.updateAuthUI === 'function') {
                            await window.updateAuthUI();
                        }
                    }
                }
            } catch (error) {
                console.error('Error updating profile:', error);
                showAlert(error.message || 'Không thể cập nhật thông tin. Vui lòng thử lại sau.', 'error');
            } finally {
                showLoading(false);
            }
        });
    }
    
    function resetForm() {
        if (currentUser) {
            loadUserData(currentUser);
            showAlert('Đã hủy thay đổi.', 'success');
        }
    }
    
    function showAlert(message, type = 'info') {
        const container = document.getElementById('alertContainer');
        const alert = document.createElement('div');
        alert.className = `alert alert-${type === 'error' ? 'error' : 'success'}`;
        
        // Support multi-line messages
        if (message.includes('\n')) {
            const lines = message.split('\n');
            lines.forEach((line, index) => {
                if (line.trim()) {
                    const lineElement = document.createElement('div');
                    lineElement.textContent = line;
                    if (index > 0) {
                        lineElement.style.marginTop = '4px';
                    }
                    alert.appendChild(lineElement);
                }
            });
        } else {
            alert.textContent = message;
        }
        
        // Add close button
        const closeBtn = document.createElement('button');
        closeBtn.innerHTML = '&times;';
        closeBtn.style.cssText = 'float: right; background: none; border: none; font-size: 1.5rem; cursor: pointer; opacity: 0.7; line-height: 1; padding: 0; margin-left: 12px;';
        closeBtn.onclick = () => alert.remove();
        closeBtn.onmouseover = () => closeBtn.style.opacity = '1';
        closeBtn.onmouseout = () => closeBtn.style.opacity = '0.7';
        alert.appendChild(closeBtn);
        
        container.innerHTML = '';
        container.appendChild(alert);
        
        // Auto remove after 7 seconds for success, 10 seconds for error
        const timeout = type === 'error' ? 10000 : 7000;
        setTimeout(() => {
            if (alert.parentNode) {
                alert.remove();
            }
        }, timeout);
    }
    
    function showLoading(show) {
        const overlay = document.getElementById('loadingOverlay');
        if (show) {
            overlay.classList.add('active');
        } else {
            overlay.classList.remove('active');
        }
    }
    function handleSearch(event) {
        event.preventDefault();
        const searchInput = document.getElementById('searchInput');
        const keyword = searchInput ? searchInput.value.trim() : '';
        
        if (keyword) {
            window.location.href = `/product.html?q=${encodeURIComponent(keyword)}`;
        } else {
            window.location.href = '/product.html';
        }
    }
    
</script>
</body>
</html>
