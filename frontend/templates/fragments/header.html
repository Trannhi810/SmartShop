<header th:fragment="header" class="header" xmlns:th="http://www.thymeleaf.org">
    <div class="container header__content">
        <div class="logo"><a href="/">SmartShop</a></div>
        <nav class="nav">
            <a href="/" class="nav__link">Trang chủ</a>
            <a href="/product.html" class="nav__link">Sản phẩm</a>
            <div class="nav__dropdown" id="categoryDropdown">
                <button class="nav__link nav__link--dropdown" id="categoryDropdownBtn" aria-expanded="false" aria-haspopup="true">
                    Danh Mục
                    <svg class="nav__dropdown-arrow" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
                        <path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
                <div class="nav__dropdown-menu" id="categoryDropdownMenu">
                    <div class="nav__dropdown-loading">Đang tải...</div>
                </div>
            </div>
        </nav>
        <div class="header__search">
            <form class="search-form" id="searchForm" onsubmit="handleSearch(event)">
                <input type="text" 
                       id="searchInput" 
                       class="search-input" 
                       placeholder="Tìm kiếm sản phẩm..." 
                       autocomplete="off"
                       aria-label="Tìm kiếm sản phẩm">
                <button type="submit" class="search-button" aria-label="Tìm kiếm">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M21 21l-6-6m2-5a7 7 0 1 1-14 0 7 7 0 0 1 14 0z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                    </svg>
                </button>
            </form>
        </div>
        <div class="header__actions header__actions--quick">
            <a href="#" id="wishlistLink" class="header__icon" aria-label="Danh sách yêu thích">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M17.657 5.343a4 4 0 0 0-5.657 0L11 6.343l-.999-1a4 4 0 1 0-5.657 5.657L11 17.657l6.657-6.657a4 4 0 0 0 0-5.657z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
                <span class="visually-hidden">Yêu thích</span>
            </a>
            <div class="header__notification-wrapper" id="headerNotificationWrapper">
                <a href="#" id="notificationIcon" class="header__icon" aria-label="Thông báo">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
                    </svg>
                    <span class="header__notification-badge d-none" id="notificationBadge">0</span>
                    <span class="visually-hidden">Thông báo</span>
                </a>
                <div class="header__notification-menu d-none" id="notificationMenu">
                    <div class="notification-menu__header">
                        <h3>Thông báo</h3>
                        <button type="button" class="notification-menu__mark-all" id="markAllReadBtn">Đánh dấu tất cả đã đọc</button>
                    </div>
                    <div class="notification-list"></div>
                </div>
            </div>
            <a href="#" id="cartLink" class="header__icon" aria-label="Giỏ hàng">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M3.5 5h2.2l1.4 9.2a1 1 0 0 0 .99.85h9.26a1 1 0 0 0 .98-.8l1.12-5.6H7.16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
                    <circle cx="10" cy="19" r="1.4" fill="none" stroke="currentColor" stroke-width="1.6"></circle>
                    <circle cx="16.5" cy="19" r="1.4" fill="none" stroke="currentColor" stroke-width="1.6"></circle>
                </svg>
                <span class="visually-hidden">Giỏ hàng</span>
            </a>
            <div class="header__account" id="headerAccountAnonymous" style="display: flex; align-items: center; gap: 0.5rem; flex-wrap: nowrap;">
                <a href="/auth/login.html" class="button button--ghost" style="white-space: nowrap;">Đăng nhập</a>
                <a href="/auth/register.html" class="button" style="white-space: nowrap;">Đăng ký</a>
            </div>
            <div class="header__account header__account--auth d-none" id="headerAccountAuth">
                <div class="header__user-wrapper">
                    <a class="header__user" href="#" id="userProfileLink" role="button" aria-expanded="false" aria-haspopup="true">
                        <span class="header__user-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24">
                                <path d="M12 12a4.5 4.5 0 1 0-4.5-4.5A4.5 4.5 0 0 0 12 12Zm0 2.25c-3.03 0-9 1.52-9 4.5v.75A1.5 1.5 0 0 0 4.5 21h15a1.5 1.5 0 0 0 1.5-1.5v-.75c0-2.98-5.97-4.5-9-4.5Z"
                                      fill="currentColor"/>
                            </svg>
                        </span>
                        <span class="header__user-name" id="userName"></span>
                        <span class="header__user-chip d-none" id="adminChip">Quản trị</span>
                        <svg class="header__user-chevron" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                            <path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </a>
                    <div class="header__user-menu d-none" id="userMenu">
                        <div class="user-menu__header">
                            <span class="user-menu__name" id="userMenuName"></span>
                            <span class="user-menu__chip d-none" id="userMenuChip">Quản trị</span>
                        </div>
                        <div class="user-menu__links">
                            <a href="/orders.html" class="user-menu__link">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2"/>
                                </svg>
                                <span>Đơn hàng của tôi</span>
                            </a>
                            <a href="/profile.html" class="user-menu__link">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                    <circle cx="12" cy="7" r="4"/>
                                </svg>
                                <span>Hồ sơ của tôi</span>
                            </a>
                            <a href="/admin/dashboard.html" class="user-menu__link d-none" id="adminMenuLink">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="3" width="7" height="7"/>
                                    <rect x="14" y="3" width="7" height="7"/>
                                    <rect x="14" y="14" width="7" height="7"/>
                                    <rect x="3" y="14" width="7" height="7"/>
                                </svg>
                                <span>Trang quản trị</span>
                            </a>
                            <button type="button" class="user-menu__link user-menu__link--logout" id="logoutButton">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                                    <polyline points="16 17 21 12 16 7"/>
                                    <line x1="21" y1="12" x2="9" y2="12"/>
                                </svg>
                                <span>Đăng xuất</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>
