<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết sản phẩm | SmartShop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/home.css">
    <link rel="stylesheet" href="/css/product.css">
    <link rel="stylesheet" href="/css/reviews.css">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="product-body">
    <div class="container">
        <div id="productDetail">
            <div class="product-detail">
                <div class="text-center" style="grid-column: 1 / -1; padding: 64px 0;">
                    <div class="spinner-border" role="status" style="width: 3rem; height: 3rem; color: var(--color-primary);">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Reviews Section -->
        <section class="reviews-section">
            <h2 class="reviews-section__title">Đánh giá sản phẩm</h2>
            
            <!-- Rating Statistics -->
            <div id="ratingStats">
                <div class="text-center" style="padding: 32px 0;">
                    <div class="spinner-border" role="status" style="width: 2rem; height: 2rem; color: var(--color-primary);">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            </div>

            <!-- Review Form Container -->
            <div id="reviewFormContainer"></div>
            <div style="margin-bottom: 24px;">
                <button class="btn btn-primary" onclick="showReviewForm(productId)" id="showReviewFormBtn" style="display: none;">
                    Viết bình luận
                </button>
            </div>

            <!-- Reviews List -->
            <div id="reviewsList">
                <div class="text-center" style="padding: 32px 0;">
                    <div class="spinner-border" role="status" style="width: 2rem; height: 2rem; color: var(--color-primary);">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            </div>
        </section>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="/js/api.js"></script>
<script src="/js/notifications.js" defer></script>
<script src="/js/home.js"></script>
<script src="/js/product-detail.js"></script>
<script src="/js/reviews.js"></script>
<script>
// Initialize reviews when page loads
document.addEventListener('DOMContentLoaded', async () => {
    const urlParams = new URLSearchParams(window.location.search);
    const productId = urlParams.get('id');
    
    if (productId) {
        // Wait for product detail to load
        setTimeout(async () => {
            await initReviews(productId);
            
            // Show review form button if authenticated
            const authenticated = await checkAuthStatus();
            const showReviewFormBtn = document.getElementById('showReviewFormBtn');
            if (showReviewFormBtn && authenticated) {
                showReviewFormBtn.style.display = 'inline-block';
            }
        }, 500);
    }
});
</script>
</body>
</html>
