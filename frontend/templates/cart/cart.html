<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ hàng - SmartShop</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="/css/home.css">
    <link rel="stylesheet" href="/css/cart.css">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main>
    <section class="section">
        <div class="container cart-container">
            <div class="cart-header">
                <h1>Giỏ hàng của bạn</h1>
                <p style="color: var(--color-muted);">Kiểm tra và chỉnh sửa các sản phẩm trong giỏ hàng</p>
            </div>
            
            <div id="cartContent">
                <div class="text-center">
                    <div class="spinner-border" role="status" style="width: 3rem; height: 3rem; color: var(--color-primary);">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="/js/api.js"></script>
<script src="/js/notifications.js" defer></script>
<script src="/js/home.js" defer></script>
<script src="/js/cart.js"></script>
<script>
    function handleSearch(event) {
        event.preventDefault();
        const searchInput = document.getElementById('searchInput');
        const keyword = searchInput ? searchInput.value.trim() : '';
        
        if (keyword) {
            window.location.href = `/product.html?q=${encodeURIComponent(keyword)}`;
        } else {
            window.location.href = '/product.html';
        }
    }
    
</script>
</body>
</html>
