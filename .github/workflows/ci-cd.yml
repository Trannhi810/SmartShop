name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ''
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: smartshop
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn clean verify
      env:
        DB_URL: jdbc:mysql://localhost:3306/smartshop?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
        DB_USERNAME: root
        DB_PASSWORD: ''

    - name: Upload JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: smartshop-app
        path: backend/target/*.jar
        retention-days: 1

  e2e-test:
    name: Playwright E2E Tests
    needs: build
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ''
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: smartshop
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Set up Java 21 (for running app)
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Download JAR Artifact
      uses: actions/download-artifact@v4
      with:
        name: smartshop-app
        path: backend/target/

    - name: Import database schema and seed data
      run: mysql --force -h 127.0.0.1 -u root smartshop < backend/database.sql



    - name: Install dependencies for Playwright
      run: npm ci
      working-directory: playwright

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      working-directory: playwright

    - name: Start Spring Boot Application
      run: java -jar target/*.jar > app.log 2>&1 &
      working-directory: backend
      env:
        DB_URL: jdbc:mysql://localhost:3306/smartshop?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
        DB_USERNAME: root
        DB_PASSWORD: ''

    - name: Wait for backend to be ready
      run: npx wait-on http://localhost:8080 -t 60000
      working-directory: playwright

    - name: Show backend logs if failed
      if: failure()
      run: cat backend/app.log

    - name: Run Playwright tests
      run: npx playwright test
      working-directory: playwright
      env:
        BASE_URL: http://localhost:8080

    - name: Upload Playwright Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright/playwright-report/
        retention-days: 30

    - name: Upload Debug Screenshots
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: debug-screenshots
        path: playwright/debug-*.png
        retention-days: 7

  deploy:
    name: Deploy to Render
    needs: e2e-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Trigger Render Deploy
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            echo "RENDER_DEPLOY_HOOK is not set. Skipping deployment."
            exit 0
          fi
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}
